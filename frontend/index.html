<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS Safari zooms in on a focused field whose text is under 16px and
      // stays zoomed. maximum-scale=1 stops that; iOS still lets people pinch
      // to zoom, so it's set there only (Android would lose pinch-zoom).
      if (/iP(hone|ad|od)/.test(navigator.platform) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      }
    </script>
    <meta name="theme-color" content="#8B0000" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600,700|manrope:200,300,400,500&display=swap" />
    <title>Najenga | Construction project management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
