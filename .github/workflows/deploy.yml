name: Deploy to Production

# Deploys via the shared deploy-kit (Juniortambo2628/OKJT): the runner builds
# the app (composer + Vite), rsyncs a release into
# ~/web/najenga.okjtech.co.ke/private/najenga/releases/, laravel-activate.sh
# links shared .env/storage, migrates, switches the `current` symlink and
# restarts the PM2 scheduler. Rollback = repoint `current`
# (see OKJT deploy-kit/README.md).

on:
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time: two deploys at once would race on the `current`
# symlink and the PM2 processes.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: Juniortambo2628/OKJT/.github/workflows/deploy-laravel.yml@main
    with:
      domain: najenga.okjtech.co.ke
      app_name: najenga
      health_path: /health
      queue: false        # QUEUE_CONNECTION=sync; set true if it moves to database
      scheduler: true     # daily model:prune + the Monday 08:00 UTC WhatsApp digest
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.PROD_ENV }}
