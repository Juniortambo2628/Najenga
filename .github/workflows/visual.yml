name: Visual

# Visual regression tests (tests/visual, Playwright): screenshots of the
# dashboard shell, the floating toolbar and list pages in the dark theme.
# Separate from "CI Tests" on purpose: deploys don't wait for it.
#
# Baselines are made here, on the runner, because fonts differ between
# machines. When a branch has none yet, or when the workflow is run by hand
# with "update" ticked, the run writes them and commits them to the branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: 'Write new baselines and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself (not the merge commit), so new baselines can be committed to it.
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, fileinfo, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Visual tests
        id: visual
        run: |
          if [ "${{ inputs.update }}" = "true" ] || ! ls tests/visual/*-snapshots/*.png >/dev/null 2>&1; then
            npx playwright test --update-snapshots
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            npx playwright test
          fi

      - name: Commit new baselines
        # Never onto main directly, and only for branches of this repository.
        if: steps.visual.outputs.updated == 'true' && github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: visual baselines made on CI"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            storage/playwright-report
            storage/playwright-results
          retention-days: 14
