name: Cert Diagnostics

# One-off, dispatch-only: inspects/fixes TLS + cron state on the VPS.
# Uses the same SSH secrets as deploy.yml. Delete after use.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Shell script to run on the server"
        required: true
        default: |
          echo '== ssl uapi (stderr visible) =='
          uapi SSL get_ssl_domains 2>&1 | head -40
          uapi SSL get_certificates 2>&1 | head -40
          echo '== autossl status (if exposed) =='
          uapi SSL get_autossl_status 2>&1 | head -25
          echo '== cron: add najenga scheduler if missing =='
          LINE="* * * * * cd $HOME/najenga-core && /usr/local/bin/php artisan schedule:run >> /dev/null 2>&1"
          if crontab -l 2>/dev/null | grep -q 'najenga-core.*schedule:run'; then
            echo 'schedule:run already present'
          else
            (crontab -l 2>/dev/null; echo "$LINE") | crontab - && echo 'schedule:run added'
          fi
          echo '== crontab now (najenga lines) =='
          crontab -l 2>/dev/null | grep -i najenga || echo 'still missing'
          echo '== validate the scheduler runs =='
          cd $HOME/najenga-core && /usr/local/bin/php artisan schedule:list 2>&1 | head -10

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configured"

      - name: Run diagnostics on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'ENDSSH'
          set +e
          ${{ inputs.cmd }}
          ENDSSH
