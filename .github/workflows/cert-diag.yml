name: Cert Diagnostics

# One-off, dispatch-only: inspects how TLS for najenga.okjtech.co.ke is
# served and renewed on the VPS. Uses the same SSH secrets as deploy.yml.
# Delete this workflow (and its branch) after use.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Shell script to run on the server"
        required: true
        default: |
          echo '== php =='
          command -v php || true
          ls /usr/local/bin/php /usr/bin/php 2>/dev/null || true
          php -v 2>/dev/null | head -1 || true
          echo '== najenga dirs =='
          ls -d $HOME/najenga-core $HOME/najenga.okjtech.co.ke 2>/dev/null || true
          echo '== najenga cron =='
          crontab -l 2>/dev/null | grep -i najenga || echo 'NO NAJENGA CRON'
          echo '== queue/cache/session (no secrets) =='
          grep -E '^(QUEUE_CONNECTION|CACHE_STORE|SESSION_DRIVER)=' $HOME/najenga-core/.env 2>/dev/null || echo 'no .env readable'
          echo '== my public ip =='
          PUBIP=$(curl -4 -s --max-time 8 https://api.ipify.org)
          echo "$PUBIP"
          echo '== cert: public ip :443 SNI najenga =='
          echo | timeout 15 openssl s_client -connect "$PUBIP:443" -servername najenga.okjtech.co.ke 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo 'pubip s_client failed'
          echo '== cert: 127.0.0.1 :443 SNI najenga =='
          echo | timeout 15 openssl s_client -connect 127.0.0.1:443 -servername najenga.okjtech.co.ke 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo 'local s_client failed'
          echo '== external hairpin: https via dns =='
          curl -sS --max-time 10 https://najenga.okjtech.co.ke/health -o /dev/null -w 'code=%{http_code}\n' 2>&1 | tail -3
          echo '== uapi ssl coverage =='
          uapi SSL get_ssl_domains 2>/dev/null | head -80 || echo 'get_ssl_domains failed'
          uapi SSL get_certificates 2>/dev/null | head -80 || echo 'get_certificates failed'
          echo '== autossl =='
          uapi SSL get_autossl_provider 2>/dev/null | head -20 || echo 'get_autossl_provider n/a'
          echo '== web server config visible? =='
          ls /etc/apache2 2>&1 | head -3
          ls /etc/nginx 2>&1 | head -3
          echo '== docroot of the subdomain =='
          uapi DomainInfo list_domains 2>/dev/null | grep -A2 najenga | head -6 || true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configured"

      - name: Run diagnostics on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'ENDSSH'
          set +e
          ${{ inputs.cmd }}
          ENDSSH
