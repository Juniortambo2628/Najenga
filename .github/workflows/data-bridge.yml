name: Data Bridge (one-off)

# One-off, dispatch-only: moves Najenga's .env, database dump and storage/app
# from the old cPanel VPS to the Hestia VPS as an intermediate hop. Nothing
# sensitive is printed (sizes only). Delete this workflow after use.
on:
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: SSH setup (old cPanel + new VPS)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/old_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/old_key ~/.ssh/vps_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configured"

      - name: Pull .env
        run: |
          ssh -i ~/.ssh/old_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat ~/najenga-core/.env" > /tmp/env.txt
          echo "env bytes: $(wc -c < /tmp/env.txt)"

      - name: Dump database
        run: |
          DB_NAME=$(ssh -i ~/.ssh/old_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd ~/najenga-core && php -r "
          \$v = [];
          foreach (file(\".env\") as \$l) {
              \$l = trim(\$l);
              if (preg_match(\"/^(DB_\\\\w+)=(.*)\$/\", \$l, \$m)) { \$v[\$m[1]] = trim(\$m[2], \"\\\"\"); }
          }
          file_put_contents(\"/tmp/.my.cnf\", \"[client]\nuser=\".\$v[\"DB_USERNAME\"].\"\npassword=\".\$v[\"DB_PASSWORD\"].\"\nhost=\".(\$v[\"DB_HOST\"] ?? \"127.0.0.1\").\"\nport=\".(\$v[\"DB_PORT\"] ?? \"3306\").\"\n\");
          chmod(\"/tmp/.my.cnf\", 0600);
          echo \$v[\"DB_DATABASE\"];
          "')
          echo "db name captured (${#DB_NAME} chars)"
          ssh -i ~/.ssh/old_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mysqldump --defaults-file=/tmp/.my.cnf --single-transaction --routines --triggers '$DB_NAME' && rm -f /tmp/.my.cnf" > /tmp/najenga.sql
          echo "dump bytes: $(wc -c < /tmp/najenga.sql)"

      - name: Tar storage/app (uploads)
        run: |
          ssh -i ~/.ssh/old_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "du -sh ~/najenga-core/storage/app | cut -f1"
          ssh -i ~/.ssh/old_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "tar czf - -C ~/najenga-core/storage app" > /tmp/najenga-storage.tgz
          echo "storage tar bytes: $(wc -c < /tmp/najenga-storage.tgz)"

      - name: Push to VPS
        run: |
          ssh -i ~/.ssh/vps_key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/najenga-migrate"
          scp -q -i ~/.ssh/vps_key -P ${{ secrets.VPS_PORT }} /tmp/env.txt /tmp/najenga.sql /tmp/najenga-storage.tgz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:najenga-migrate/
          ssh -i ~/.ssh/vps_key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -la ~/najenga-migrate/"
          rm -f /tmp/env.txt /tmp/najenga.sql /tmp/najenga-storage.tgz
          echo "Bridge complete"

      - name: Cleanup temp keys
        if: always()
        run: rm -f ~/.ssh/old_key ~/.ssh/vps_key
